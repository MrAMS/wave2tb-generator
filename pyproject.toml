[project]
name = "wave2tb-generator"
version = "0.1.0"
description = "Generate cycle-accurate SystemVerilog testbenches from VCD waveforms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.25.2",
    "tree-sitter-verilog>=1.0.3",
    "vcdvcd>=2.6.0",
]

[project.scripts]
wave2tb = "wave2tb_generator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wave2tb_generator*"]
